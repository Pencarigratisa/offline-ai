name: Build Offline AI APK

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.2.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2.1'

      - name: Check project files
        run: |
          echo "=== ROOT PROJECT ==="
          pwd
          ls -la
          echo "=== GRADLE FILES ==="
          find . -maxdepth 3 -type f \( -name "build.gradle" -o -name "build.gradle.kts" -o -name "settings.gradle" -o -name "settings.gradle.kts" \) -print

      - name: Build Debug APK
        run: |
          gradle --no-daemon --stacktrace assembleDebug

      - name: Verify APK output
        run: |
          echo "=== APK OUTPUT ==="
          find "$GITHUB_WORKSPACE" -type f -name "*.apk" -print

          if [ ! -f "$GITHUB_WORKSPACE/app/build/outputs/apk/debug/app-debug.apk" ]; then
            echo "ERROR: app-debug.apk tidak ditemukan!"
            exit 1
          fi

          echo "APK ditemukan:"
          ls -lh "$GITHUB_WORKSPACE/app/build/outputs/apk/debug/app-debug.apk"

      - name: Prepare APK artifact
        run: |
          mkdir -p artifact

          cp "$GITHUB_WORKSPACE/app/build/outputs/apk/debug/app-debug.apk" \
             "$GITHUB_WORKSPACE/artifact/OfflineAI-debug.apk"

          ls -lh "$GITHUB_WORKSPACE/artifact/OfflineAI-debug.apk"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OfflineAI-APK
          path: artifact/OfflineAI-debug.apk
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
