name: Build Offline AI APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.2.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2.1'

      - name: Extract project ZIP
        shell: bash
        run: |
          echo "Mencari file ZIP..."

          ZIP_FILE=$(find "$GITHUB_WORKSPACE" \
            -maxdepth 2 \
            -type f \
            -name "*.zip" \
            | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: File ZIP tidak ditemukan!"
            exit 1
          fi

          echo "ZIP ditemukan:"
          echo "$ZIP_FILE"

          mkdir -p "$GITHUB_WORKSPACE/project"

          unzip -o "$ZIP_FILE" \
            -d "$GITHUB_WORKSPACE/project"

          echo ""
          echo "Isi hasil extract:"
          find "$GITHUB_WORKSPACE/project" -maxdepth 3 -type f | head -100

      - name: Find Gradle project
        shell: bash
        run: |
          SETTINGS_FILE=$(find "$GITHUB_WORKSPACE/project" \
            -type f \
            \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
            | head -n 1)

          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: settings.gradle tidak ditemukan setelah extract!"
            echo ""
            echo "Struktur project:"
            find "$GITHUB_WORKSPACE/project" -maxdepth 4 -type f | sort
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS_FILE")

          echo "Gradle project ditemukan:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Build APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          gradle --no-daemon --stacktrace assembleDebug

      - name: Find APK
        shell: bash
        run: |
          echo "Mencari APK..."

          find "$PROJECT_DIR" \
            -type f \
            -name "*.apk" \
            -print

      - name: Prepare APK
        shell: bash
        run: |
          APK_FILE=$(find "$PROJECT_DIR" \
            -type f \
            -path "*/build/outputs/apk/debug/*.apk" \
            | head -n 1)

          if [ -z "$APK_FILE" ]; then
            echo "ERROR: APK tidak ditemukan!"
            exit 1
          fi

          mkdir -p "$GITHUB_WORKSPACE/artifact"

          cp "$APK_FILE" \
            "$GITHUB_WORKSPACE/artifact/OfflineAI-debug.apk"

          echo "APK siap:"
          ls -lh "$GITHUB_WORKSPACE/artifact/OfflineAI-debug.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: OfflineAI-APK
          path: artifact/OfflineAI-debug.apk
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
