name: Build Offline AI from ZIP

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # IMPORTANT: the source project is inside offline-ai-source.zip.
      # Extract it BEFORE setup-java so setup-java never tries to inspect
      # Gradle files that do not exist yet.
      - name: Extract source ZIP
        shell: bash
        run: |
          set -euo pipefail
          test -f offline-ai-source.zip
          mkdir -p extracted
          unzip -q offline-ai-source.zip -d extracted
          rm -rf extracted/.github
          cp -a extracted/. .
          rm -rf extracted
          test -f settings.gradle.kts
          test -f app/build.gradle.kts

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle 8.2.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2.1'

      - name: Verify project files
        run: |
          echo "Project root: $(pwd)"
          test -f settings.gradle.kts
          test -f build.gradle.kts
          test -f app/build.gradle.kts
          echo "Gradle project detected successfully."

      - name: Build Debug APK
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: offline-ai-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

